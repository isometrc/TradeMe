<!DOCTYPE html>
<html>
<head>
  <title> TradeMe </title>
</head>
<style>
body {font-family: Arial, Helvetica, sans-serif;}
* {box-sizing: border-box}
body {
  background-color: rgb(255, 255, 255);
}

img {
width:15%;
}
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}

li {
  float: left;
}

li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

body {
  margin: 0;
}

li a:hover{
background-color:  #4CAF50;

}

li a:hover(.active) {
  background-color: #111;
}

.active {
  background-color: #4CAF50;
}
div.form
{
    margin-top: 20px;
    margin-bottom: 20px;
    display: block;
    text-align: center;
    
}
form
{
    
    display: inline-block;
    margin-left: auto;
    margin-right: auto;
    text-align: left;
    padding-left: 20px;
    padding-right: 20px;
}
/* Full-width input fields */
input[type=text], input[type=password] {
  width: 100%;
  padding: 15px;
  padding-right: 400px;
  margin: 12px 0 12px 0;
  display: block;
  border: none;
  background: #f1f1f1;
  
}


input[type=text]:focus, input[type=password]:focus {
  background-color: #ddd;
  outline: none;
}

hr {
  border: 1px solid grey;
  margin-bottom: 25px;
}

/* Set a style for all buttons */
button {
  background-color: #4CAF50;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 50%;
  opacity: 0.9;
}

button:hover {
  opacity:1;
}

/* Extra styles for the cancel button */
.cancelbtn {
  padding: 14px 20px;
  background-color: #f44336;
}

/* Float cancel and signup buttons and add an equal width */
.cancelbtn, .signupbtn {
  float: left;
  width: 100%;
}

/* Add padding to container elements */
.container {
  padding: 16px;
}

/* Clear floats */
.clearfix::after {
  content: "";
  clear: both;
  display: table;
}

/* Change styles for cancel button and signup button on extra small screens */
@media screen and (max-width: 300px) {
  .cancelbtn, .signupbtn {
     width: 100%;
  }
}
</style>
<body>
  <div style="background-color:  #4CAF50; height: 500px; width: 100%; " >
  
  
    <img src="/assets/images/logo.png" alt="logo" style=" position: absolute; width:700px;height:600px;  vertical-align:middle;margin:1px 450px; vertical-align: top;margin-bottom: 200px; ">
  </div>
  <ul>
    <li><a href="/">Home</a></li>
    <li style="float:right"><a class="active" href="signup.html"  >Sign Up</a></li> 
    <li style="float:right"><a  href="signin.html">Sign In</a></li>
  </ul>
<div class="form">
<form action="/signup" method="POST" style="border: 1px solid grey;">
  <div class="container">
    <h1>Sign Up</h1>
    <p>Please fill in this form to create an account.</p>
    <hr>

    <label for="username" ><b>Username</b></label>
    <input type="text" size="30" maxlength="30" placeholder="Enter Username" name="username" required >
  
    <label for="display name"><b>Display Name</b></label>
    <input type="text" size="30" maxlength="30" placeholder="Enter Display Name" name="displayname" required>
    
    <label for="password"><b>Password</b></label>
    <input type="password" size="16" maxlength="16" placeholder="Enter Password" name="password" required>

    <div class="clearfix">
      <button type="submit" class="signupbtn">Sign Up</button>
    </div>
  </div>
</form>
</div>

</body>
</html>
